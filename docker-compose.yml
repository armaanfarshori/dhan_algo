# LOCAL DEVELOPMENT ONLY — NOT used in production (AWS EC2, private subnet)
# Use for: running alembic migrations locally, testing backfill, local dev
#   docker compose up -d && alembic upgrade head
# Production DB is on EC2: DB_HOST=<private DB IP> (set in .env on agent)
services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: dhan_timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dhan_trading
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trader123}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d dhan_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescale_data:
