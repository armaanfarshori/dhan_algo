name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN for all jobs (CodeQL: actions/missing-workflow-permissions).
# CI only reads the repo; it needs no write scopes.
permissions:
  contents: read

jobs:
  test:
    name: test-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: ubuntu-latest
          - arch: arm
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Test deps only — torch/scipy etc. are runtime-only and add minutes
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov pydantic-settings python-dotenv \
                      aiohttp sqlalchemy pandas numpy pytz pyotp dhanhq

      - name: Compile all modules
        run: python -m compileall -q backfill.py config.py db.py apps/ core/ engine/ ml/ strategies/

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=. --cov-report=term-missing \
            --cov-fail-under=41

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint check
        run: ruff check .
