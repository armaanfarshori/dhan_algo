name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # Test deps only — torch/scipy etc. are runtime-only and add minutes
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pydantic-settings python-dotenv \
                      aiohttp sqlalchemy pandas numpy pytz pyotp dhanhq

      - name: Compile all modules
        run: python -m compileall -q backfill.py config.py db.py apps/ core/ engine/ ml/ strategies/

      - name: Run tests
        run: pytest tests/ -v --tb=short
