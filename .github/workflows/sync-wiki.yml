name: Sync docs to wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Clone wiki
        run: |
          git clone \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki

      - name: Copy docs into wiki
        run: |
          cp docs/*.md wiki/
          if [ -d docs/images ]; then
            mkdir -p wiki/images && cp docs/images/* wiki/images/ 2>/dev/null || true
          fi

      - name: Commit and push if changed
        run: |
          cd wiki
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "Wiki already up to date."
          else
            COMMIT=$(git -C .. rev-parse --short HEAD)
            git commit -m "docs: auto-sync from main@${COMMIT}"
            git push
            echo "Wiki updated."
          fi
